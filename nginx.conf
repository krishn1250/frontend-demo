server {
  # 8080, not 80: the pod runs as non-root (uid 101), and binding a port below
  # 1024 needs CAP_NET_BIND_SERVICE, which the manifest drops.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  access_log /dev/stdout;
  error_log /dev/stderr;
}
