name: Build Docker image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Checkout and build frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image (no push)
        run: |
          docker --version
          docker build -t restaurent-ui:ci-${{ github.sha }} Docker-tasks/frontend-project
