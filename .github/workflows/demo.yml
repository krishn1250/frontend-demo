name: Build Docker image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Checkout and build frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: Docker-tasks/frontend-project
          file: Docker-tasks/frontend-project/Dockerfile
          push: false
          tags: restaurent-ui:ci-${{ github.sha }}
